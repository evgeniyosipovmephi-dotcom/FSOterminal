plugins {
    id 'java'
    id 'application'
    id 'eclipse'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.matching("BellSoft")
    }
}

dependencies {
    implementation files('lib/jSerialComm-2.11.4.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'fsoterminal.core.Main'
}

test {
    useJUnitPlatform()
    // Пробрасываем serial.*, bulk.*, window.* свойства из Gradle в JVM тестов
    systemProperties System.properties.subMap(
        System.properties.keySet().findAll { key ->
            ['serial.', 'bulk.', 'window.', 'test.'].any { key.toString().startsWith(it) }
        }
    )
    // Показываем stdout/stderr тестов прямо в консоли Gradle
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed', 'skipped'
    }
    // UTF-8 для System.out в тестах — иначе кириллица ломается в PowerShell
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

compileJava.options.encoding = 'UTF-8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// ============================================================
// jpackage: создаёт Windows .exe установщик
// Запуск: gradlew.bat jpackage
// Требует WiX Toolset (https://wixtoolset.org) для --type exe
// Для простого portable-запуска: --type app-image
// ============================================================
task jpackage(type: Exec, dependsOn: installDist) {
    def javaHome = System.getenv('JAVA_HOME') ?: 'C:\\Program Files\\BellSoft\\LibericaJDK-21-Full'
    def distLib  = "${buildDir}/install/${project.name}/lib"
    def destDir  = "${buildDir}/dist"
    def appVer   = '1.2.0'

    doFirst { mkdir destDir }

    // app-image — не требует WiX, создаёт portable папку
    commandLine "${javaHome}/bin/jpackage",
        '--type',        'app-image',
        '--name',        'FSOTerminal',
        '--app-version', appVer,
        '--input',       distLib,
        '--main-jar',    jar.archiveFileName.get(),
        '--main-class',  'fsoterminal.core.Main',
        '--dest',        destDir,
        '--java-options', '-Xmx256m'
}

// Альтернатива: установщик .exe (требует WiX Toolset)
task jpackageExe(type: Exec, dependsOn: installDist) {
    def javaHome = System.getenv('JAVA_HOME') ?: 'C:\\Program Files\\BellSoft\\LibericaJDK-21-Full'
    def distLib  = "${buildDir}/install/${project.name}/lib"
    def destDir  = "${buildDir}/dist"

    doFirst { mkdir destDir }

    commandLine "${javaHome}/bin/jpackage",
        '--type',        'exe',
        '--name',        'FSOTerminal',
        '--app-version', '1.0.0',
        '--input',       distLib,
        '--main-jar',    jar.archiveFileName.get(),
        '--main-class',  'fsoterminal.core.Main',
        '--dest',        destDir,
        '--win-menu',
        '--win-shortcut',
        '--win-dir-chooser',
        '--java-options', '-Xmx256m'
}
